name: BMS Ticket Checker

on:
schedule:
- cron: '*/10 * * * *'
workflow_dispatch:

jobs:
check:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Restore previous state
    uses: actions/cache/restore@v4
    with:
      path: bms_state.json
      key: bms-state-${{ github.run_id }}
      restore-keys: |
        bms-state-

  - name: Initialize state file
    run: |
      test -f bms_state.json || echo "{}" > bms_state.json

  - name: Install uv
    uses: astral-sh/setup-uv@v5

  - name: Install dependencies
    run: uv sync

  - name: Run checker
    env:
      BMS_URL: ${{ secrets.BMS_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      BMS_THEATRE: ${{ secrets.BMS_THEATRE }}
      BMS_DATES: ${{ secrets.BMS_DATES }}
      BMS_TIME: ${{ secrets.BMS_TIME }}
    run: uv run python bms_checker.py

  - name: Save updated state
    if: always()
    uses: actions/cache/save@v4
    with:
      path: bms_state.json
      key: bms-state-${{ github.run_id }}
```
